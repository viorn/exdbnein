# exdbnein — auto-start the installer on tty1 (P8.3).
# Instead of agetty/login on tty1 the installer runs (root — system service).
# Debugging: tty2 (getty@tty2.service, user live, passwordless sudo).
[Service]
ExecStart=
ExecStart=-/opt/exdbnein/exdbnein
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
Environment=LANG=C.UTF-8
Environment=LC_ALL=C.UTF-8
# exdbnein — auto-start the installer on tty1 (P8.3).
# Instead of agetty/login on tty1 the autostart wrapper runs (root — system service):
# interactive installer by default, unattended install when the kernel cmdline
# contains `exdbnein.config=auto` (QEMU automation, P9.1).
# Debugging: tty2 (getty@tty2.service, user live, passwordless sudo), ttyS0 (serial).
[Service]
ExecStart=
ExecStart=-/opt/exdbnein/autostart.sh
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
Environment=LANG=C.UTF-8
Environment=LC_ALL=C.UTF-8
# exdbnein — автозапуск установщика на tty1 (P8.3).
# Вместо agetty/login на tty1 запускается установщик (root — системная служба).
# Отладка: tty2 (getty@tty2.service, пользователь live, sudo без пароля).
[Service]
ExecStart=
ExecStart=-/opt/exdbnein/exdbnein
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
Environment=LANG=C.UTF-8
Environment=LC_ALL=C.UTF-8
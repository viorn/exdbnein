# exdbnein — GRUB configuration for the LiveCD ISO (stage 8).
#
# The kernel command line is generated by livecd/build.sh from the template
# variable @KERNEL_PARAMS@ (stage_boot_files). Base params enable the serial
# console (ttyS0, 115200 baud) for debugging and QEMU automation; with AUTOTEST=1
# `exdbnein.config=auto` is appended — the installer then runs in automated mode
# (see /opt/exdbnein/autostart.sh in the live root, P9.1).

set timeout=5
set default=0

menuentry "exdbnein — Debian installer (default)" {
  search --no-floppy --set=root --label EXDBNEIN_LIVE
  linux /live/vmlinuz @KERNEL_PARAMS@
  initrd /live/initrd.img
}

menuentry "exdbnein — Debian installer (verbose)" {
  search --no-floppy --set=root --label EXDBNEIN_LIVE
  linux /live/vmlinuz @KERNEL_PARAMS@ nomodeset
  initrd /live/initrd.img
}